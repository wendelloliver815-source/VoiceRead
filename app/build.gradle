plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voicenotetransmission'
    compileSdk 35

    defaultConfig {
        applicationId 'com.voicenotetransmission'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3:1.3.2'
}
